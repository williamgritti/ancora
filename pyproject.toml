[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ancora-rag"
version = "0.1.1"
description = "Grounded answers, or an honest escalation. A dependency-free hallucination gate for RAG chatbots."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = [
    "rag", "hallucination", "grounding", "llm", "chatbot",
    "guardrails", "citations", "faithfulness", "evaluation",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/williamgritti/ancora"
Repository = "https://github.com/williamgritti/ancora"
Issues = "https://github.com/williamgritti/ancora/issues"
Changelog = "https://github.com/williamgritti/ancora/blob/main/CHANGELOG.md"

[project.optional-dependencies]
openai = ["openai>=1.0"]
anthropic = ["anthropic>=0.39"]
dev = ["pytest>=7.4", "pytest-cov>=4.1"]

[project.scripts]
ancora = "ancora.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ancora"]
# The .json vertical packs live inside the package and must ship with it.
artifacts = ["src/ancora/packs/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
